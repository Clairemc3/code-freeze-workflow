name: Code Freeze Gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  enforce-freeze:
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enforce freeze policy
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const core = require('@actions/core');

            const policyPath = '.github/freeze-policy.json';
            if (!fs.existsSync(policyPath)) {
              core.setFailed(`Missing policy file: ${policyPath}`);
              return;
            }

            const policy = JSON.parse(fs.readFileSync(policyPath, 'utf8'));
            const pr = context.payload.pull_request;
            const labels = (pr.labels || []).map((l) => l.name);

            const start = policy.freezeWindow?.startMonthDay;
            const end = policy.freezeWindow?.endMonthDay;
            const requiredLabel = policy.rules?.requiredExceptionLabel;

            if (!start || !end || !requiredLabel) {
              core.setFailed('Invalid freeze policy. Expected startMonthDay, endMonthDay, and requiredExceptionLabel.');
              return;
            }

            const now = new Date();
            const month = String(now.getUTCMonth() + 1).padStart(2, '0');
            const day = String(now.getUTCDate()).padStart(2, '0');
            const today = `${month}-${day}`;

            function inFreezeWindow(today, start, end) {
              if (start <= end) {
                return today >= start && today <= end;
              }

              return today >= start || today <= end;
            }

            const isFrozen = inFreezeWindow(today, start, end);

            core.info(`Today (UTC): ${today}`);
            core.info(`Freeze window: ${start} -> ${end}`);
            core.info(`PR labels: ${labels.join(', ') || '(none)'}`);

            if (!isFrozen) {
              core.notice('No active freeze window. Merge allowed by this check.');
              return;
            }

            if (!labels.includes(requiredLabel)) {
              core.setFailed(
                `Code freeze is active (${start} -> ${end}). ` +
                `This PR is missing required label: ${requiredLabel}.`
              );
              return;
            }

            core.notice(
              `Code freeze is active, but PR includes ${requiredLabel}. ` +
              'Merge is allowed by this check.'
            );
